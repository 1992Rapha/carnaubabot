<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="7" 
                refX="0" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" />
        </marker>
    </defs>
    <g>
        <!-- Example Multiport Block -->
        <rect x="50" y="50" width="150" height="100" stroke="black" fill="lightgrey" />
        <text x="125" y="100" text-anchor="middle">Multiport Block</text>
        <!-- Snapping toggle and alignment guides demonstration -->
        <line x1="0" y1="300" x2="800" y2="300" stroke="lightblue" stroke-dasharray="5,5" />
        <rect x="200" y="250" width="150" height="100" stroke="black" fill="lightyellow" />
        <text x="275" y="300" text-anchor="middle">Snapping Toggle</text>
    </g>
    <!-- Advanced routing with fewer bends -->
    <path d="M50 200 Q 150 100, 300 200 T 500 200" stroke="black" fill="transparent" marker-end="url(#arrow)" />
    <!-- Branch derivation nodes -->
    <circle cx="300" cy="200" r="10" fill="blue" />
    <text x="300" y="215" text-anchor="middle">Branch Node</text>
    <circle cx="500" cy="200" r="10" fill="blue" />
    <text x="500" y="215" text-anchor="middle">Branch Node</text>
    <g>
        <rect x="700" y="500" width="80" height="30" stroke="black" fill="grey" />
        <text x="740" y="520" text-anchor="middle" fill="white">Context Menu</text>
    </g>
</svg>
